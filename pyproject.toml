[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptpsim"
version = "0.1.0"
description = "Closed-loop discrete-event simulator of a Zephyr PTPv2 time receiver (PI servo + NXP ENET PHC)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]
test = ["pytest>=7"]
docs = ["matplotlib>=3.7"]

[project.scripts]
ptpsim-gui = "ptpsim.gui.app:main"
ptpsim-run = "ptpsim.cli:main"

[tool.setuptools.packages.find]
include = ["ptpsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
